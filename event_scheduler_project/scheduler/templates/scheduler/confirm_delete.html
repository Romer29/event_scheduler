{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Delete Event</h2>
  <p>Are you sure you want to delete "{{ event.title }}"?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'scheduler:admin_approvals' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
