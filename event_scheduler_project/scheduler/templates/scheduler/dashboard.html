{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Dashboard | Event Scheduler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #0d6efd, #dc3545);
      color: white;
      min-height: 100vh;
    }
    .navbar {   
      background-color: #fff;
    }
    .navbar a {
      color: #0d6efd !important;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#">EventScheduler</a>
      <div class="d-flex">
        <a href="{% url 'event_create' %}" class="btn btn-danger me-2">+ New Event</a>
        <a href="{% url 'logout' %}" class="btn btn-outline-primary">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center mb-4">Welcome, {{ user.username }}!</h2>
    <p class="text-center text-light">Manage and view your events below.</p>
  </div>
</body>
</html>
