{% extends "scheduler/student_base.html" %}
{% block title %}Add Event{% endblock %}

{% block content %}
<h2 class="text-center mb-4">Add New Event</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" required>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description"></textarea>
    </div>
    <div class="mb-3">
        <label for="start_time" class="form-label">Start Time</label>
        <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
    </div>
    <div class="mb-3">
        <label for="end_time" class="form-label">End Time</label>
        <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
    </div>

        <div class="mb-3">
        <label for="location" class="form-label">location</label>
        <input type="location" class="form-control" id="location" name="location" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Submit for Approval</button>
</form>
{% endblock %}
