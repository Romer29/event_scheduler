{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4">
  <h3 class="fw-bold text-primary">{% if object %}Edit Event{% else %}Create Event{% endif %}</h3>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="row g-3">
      {% for field in form %}
        <div class="col-md-6">
          <label class="form-label fw-semibold">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary mt-4">Save</button>
    <a href="{% url 'scheduler:event_list' %}" class="btn btn-secondary mt-4">Cancel</a>
  </form>
</div>
{% endblock %}
