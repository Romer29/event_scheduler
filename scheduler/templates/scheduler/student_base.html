{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Student Dashboard{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-blue: #007bff;
      --accent-red: #e63946;
      --background-white: #ffffff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--background-white);
      color: #27ff0b;
      padding-top: 70px;
    }

    .navbar {
      background: linear-gradient(90deg, var(--primary-blue), var(--accent-red));
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff !important;
      font-weight: 700;
      text-decoration: none;
    }

    .navbar-brand img {
      height: 40px;
      width: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      padding: 3px;
    }

    .card {
      border-radius: 15px;
      border: none;
      transition: all 0.3s ease;
      background: #fff;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: var(--primary-blue);
      border: none;
    }

    .btn-success {
      background-color: #28a745;
      border: none;
    }

    .btn-danger {
      background-color: var(--accent-red);
      border: none;
    }

    .btn-primary:hover,
    .btn-success:hover,
    .btn-danger:hover {
      opacity: 0.9;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.8s ease forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      border-top: 1px solid #eee;
      margin-top: 50px;
    }

     /* Dark Mode */
    .dark-mode {
      background-color: #121212;
      color: #f1f1f1;
    }
    .dark-mode .card {
      background-color: #1e1e1e;
      color: #fff;
    }
    .dark-mode .navbar {
      background: linear-gradient(90deg, #333, #555);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand" href="{% url 'scheduler:student_event_view' %}">
        <img src="{% static 'images/hcdc_logo.png' %}" alt="HCDC Logo">
        Student Portal
      </a>

      <div class="d-flex align-items-center gap-2">
        <!-- Username -->
        {% if user.is_authenticated %}

          <a class="btn btn-primary btn-sm" href="{% url 'scheduler:student_event_view' %}">My Events</a>
        <span class="badge bg-primary text-white px-3 py-2">👤 {{ user.username }}</span>
     <a href="{% url 'scheduler:logout_view' %}" class="btn btn-danger btn-sm">Logout</a>
        {% endif %}
      </div>
      <button class="btn btn-outline-light ms-2" id="themeToggle">🌙</button>
      <span id="liveClock" class="text-white ms-3"></span>
    </div>
  </nav>

  <!-- Floating Add Event Button -->
  <a href="{% url 'scheduler:student_event_add' %}" 
     class="btn btn-success position-fixed rounded-circle shadow"
     style="bottom: 30px; right: 30px; width: 60px; height: 60px; font-size: 30px; display:flex; align-items:center; justify-content:center;">
    +
  </a>

  <!-- Quick Calendar -->
  <div class="container mt-4 fade-in">
    <div class="card p-3 my-4">
      <h5 class="mb-3">📅 Quick Calendar</h5>
      <iframe 
        src="https://calendar.google.com/calendar/embed?showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0&mode=MONTH"
        style="border:0;" width="100%" height="300" frameborder="0" scrolling="no">
      </iframe>
    </div>

    <!-- Content -->
    {% block content %}{% endblock %}
  </div>

  <footer>© {{ now|date:"Y" }} Student Portal | Powered by Group 6 /footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Dark Mode Toggle
    const toggleBtn = document.getElementById('themeToggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      toggleBtn.textContent = '☀️';
    }

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
